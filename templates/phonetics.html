<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetics & IPA Transcriptions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: transparent; color: #f8fafc; padding: 0 24px 24px; display: flex; flex-direction: column; align-items: center; }
        .box { background: rgba(12, 19, 24, .88); padding: 28px; border-radius: 12px; width: 100%; max-width: 700px; border: 1px solid rgba(210, 225, 229, .26); box-shadow: 0 15px 30px rgba(0,0,0,.32); backdrop-filter: blur(8px); }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #38bdf8; text-decoration: none; font-size: 15px; font-weight: bold; margin-bottom: 20px; transition: 0.2s; }
        .back-btn:hover { transform: translateX(5px); }
        textarea { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: 1px solid rgba(210, 225, 229, .28); background: rgba(5, 10, 13, .78); color: white; font-size: 15px; box-sizing: border-box; }
        .output-box { margin-top: 20px; background: rgba(5, 10, 13, .82); padding: 18px; border-radius: 8px; border-left: 3px solid #f0aaa3; white-space: pre-line; line-height: 1.8; font-size: 19px; direction: ltr; text-align: left; }
        .ipa-text { font-family: 'Courier New', Courier, monospace; color: #b8d6df; font-weight: bold; font-size: 20px; }
        @media (max-width: 520px) { body { padding: 12px; } .box { padding: 20px; } }
    </style>
</head>
<body class="{% if site_content.background_enabled %}has-site-background{% endif %}">
{% include '_navbar.html' %}

<div class="box">
    <!-- Back to home -->
    <a href="/" class="back-btn">➔ Back to Home</a>

    <h2>IPA Phonetic Transcription</h2>
    <p style="color: #a3a3a3; font-size: 14px;">Enter English text to see its pronunciation in IPA symbols.</p>

    <textarea id="txt" rows="5" placeholder="Enter English text here..."></textarea>
    <div class="output-box" id="result" aria-live="polite">Type to see the phonetic transcription...</div>
</div>

<script>
    const input = document.getElementById('txt');
    const result = document.getElementById('result');
    let timer;
    let controller;

    async function processPhonetics() {
        const text = input.value.trim();
        if (!text) { result.textContent = 'Type to see the phonetic transcription...'; return; }
        if (controller) controller.abort();
        controller = new AbortController();
        const currentController = controller;
        result.textContent = 'Preparing phonetic transcription...';
        try {
            const response = await fetch('/phonetics_process', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text}),
                signal: currentController.signal
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to prepare phonetic transcription.');
            if (controller === currentController) result.textContent = data.ipa;
        } catch (error) {
            if (error.name !== 'AbortError' && controller === currentController) result.textContent = error.message;
        }
    }

    input.addEventListener('input', () => {
        clearTimeout(timer);
        if (controller) controller.abort();
        timer = setTimeout(processPhonetics, 350);
    });
</script>

</body>
</html>
