<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Translation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: transparent; color: #f8fafc; padding: 0 24px 24px; display: flex; flex-direction: column; align-items: center; }
        .box { background: rgba(12, 19, 24, .88); padding: 28px; border-radius: 12px; width: 100%; max-width: 760px; border: 1px solid rgba(210, 225, 229, .26); box-shadow: 0 15px 30px rgba(0,0,0,.32); backdrop-filter: blur(8px); }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #38bdf8; text-decoration: none; font-size: 15px; font-weight: bold; margin-bottom: 20px; transition: 0.2s; }
        .back-btn:hover { transform: translateX(5px); }
        textarea, select { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: 1px solid rgba(210, 225, 229, .28); background: rgba(5, 10, 13, .78); color: white; font-size: 15px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; align-items: center; }
        .swap-btn { flex: 0 0 42px; width: 42px; height: 42px; padding: 0; border: 1px solid rgba(210, 225, 229, .28); border-radius: 8px; background: rgba(19, 25, 29, .9); color: #b8d6df; font-size: 20px; cursor: pointer; }
        .output-box { margin-top: 20px; background: rgba(5, 10, 13, .82); padding: 18px; border-radius: 8px; border-left: 3px solid #f0aaa3; min-height: 120px; white-space: pre-line; line-height: 1.7; font-size: 16px; text-align: left; }
        .row select { min-width: 0; width: 0; flex: 1 1 0; }
        .output-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .copy-output { padding: 9px 14px; border: 1px solid rgba(210, 225, 229, .28); border-radius: 6px; background: rgba(19, 25, 29, .9); color: #ffd0c8; cursor: pointer; }
        .copy-output:disabled { opacity: .5; cursor: not-allowed; }
        .copy-status { min-height: 1.4em; color: #ffd0c8; font-size: 13px; }
        @media (max-width: 520px) { body { padding: 12px; } .box { padding: 20px; } .row { gap: 6px; } .swap-btn { flex-basis: 38px; width: 38px; } }
    </style>
</head>
<body>
{% include '_navbar.html' %}

<div class="box">
    <!-- Back to home -->
    <a href="/" class="back-btn">➔ Back to Home</a>
    <h2>Direct Translation</h2>
    <p style="color: #a3a3a3; font-size: 14px;">Enter text and its translation will appear automatically.</p>

    <div class="row">
        <select id="srcLang">
            <option value="en">From English</option>
            <option value="ar">From Arabic</option>
        </select>
        <button type="button" class="swap-btn" id="swapLanguages" aria-label="Swap languages" title="Swap languages">⇄</button>
        <select id="tgtLang">
            <option value="ar">To Arabic</option>
            <option value="en">To English</option>
        </select>
    </div>

    <textarea id="txt" rows="6" placeholder="Paste paragraphs or long text here for quick translation..."></textarea>
    
    <div class="output-box" id="result" aria-live="polite">Start typing to see the translation...</div>
    <div class="output-actions">
        <button type="button" class="copy-output" id="copyResult" disabled>Copy translation</button>
        <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
    </div>
</div>

<script>
    const input = document.getElementById('txt');
    const result = document.getElementById('result');
    const srcLang = document.getElementById('srcLang');
    const tgtLang = document.getElementById('tgtLang');
    const copyButton = document.getElementById('copyResult');
    const copyStatus = document.getElementById('copyStatus');
    let timer;
    let controller;
    let translatedText = '';

    async function copyTranslation() {
        if (!translatedText) return;
        try {
            await navigator.clipboard.writeText(translatedText);
            copyStatus.textContent = 'Translation copied.';
        } catch {
            copyStatus.textContent = 'Unable to copy. Check your browser clipboard permissions.';
        }
    }

    copyButton.addEventListener('click', copyTranslation);

    async function translateFast() {
        const text = input.value.trim();
        if (!text) { result.textContent = 'Start typing to see the translation...'; translatedText = ''; copyButton.disabled = true; return; }
        if (controller) controller.abort();
        controller = new AbortController();
        const currentController = controller;
        result.textContent = 'Translating...';
        try {
            const response = await fetch('/translate_fast', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text, src: srcLang.value, tgt: tgtLang.value}),
                signal: currentController.signal
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Translation failed.');
            if (controller === currentController) {
                result.textContent = data.result;
                translatedText = data.result;
                copyButton.disabled = !translatedText;
            }
        } catch (error) {
            if (error.name !== 'AbortError' && controller === currentController) result.textContent = error.message;
        }
    }

    function scheduleTranslation() {
        clearTimeout(timer);
        if (controller) controller.abort();
        translatedText = '';
        copyButton.disabled = true;
        copyStatus.textContent = '';
        timer = setTimeout(translateFast, 250);
    }

    input.addEventListener('input', scheduleTranslation);
    srcLang.addEventListener('change', scheduleTranslation);
    tgtLang.addEventListener('change', scheduleTranslation);
    document.getElementById('swapLanguages').addEventListener('click', () => {
        const source = srcLang.value;
        srcLang.value = tgtLang.value;
        tgtLang.value = source;
        scheduleTranslation();
    });
</script>

</body>
</html>
